name: Terraform

on:
  pull_request:
    paths:
      - "**.tf"
      - "**.tftpl"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "**.tf"
      - "**.tftpl"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  TF_IN_AUTOMATION: "true"
  TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
  TF_VAR_user_ocid: ${{ secrets.OCI_USER_OCID }}
  TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
  TF_VAR_region: ${{ secrets.OCI_REGION }}
  TF_VAR_compartment_ocid: ${{ secrets.OCI_COMPARTMENT_OCID }}
  TF_VAR_ssh_authorized_keys: ${{ secrets.OCI_SSH_AUTHORIZED_KEYS }}
  TF_VAR_image_ocid: ${{ secrets.OCI_ARM_IMAGE_OCID }}
  TF_VAR_amd_image_ocid: ${{ secrets.OCI_AMD_IMAGE_OCID }}
  TF_VAR_k3s_token: ${{ secrets.K3S_TOKEN }}
  TF_VAR_tailscale_auth_key_server: ${{ secrets.TAILSCALE_AUTH_KEY_SERVER }}
  TF_VAR_tailscale_auth_key_agent: ${{ secrets.TAILSCALE_AUTH_KEY_AGENT }}

jobs:
  # secrets isn't available in job-level `if:` (only github/inputs/needs/vars
  # are), so this dedicated job checks it in a step and exposes an output.
  # plan/apply then key off `needs.check-secrets.outputs.configured`, so they
  # report as genuinely Skipped -- not a misleading green success with every
  # step individually skipped -- on a fresh clone/fork with no secrets yet.
  check-secrets:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check OCI secrets configured
        id: check
        run: |
          if [ -n "${{ secrets.OCI_TENANCY_OCID }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::OCI secrets aren't configured on this repo yet -- plan/apply will be skipped. See README.md#cicd."
          fi

  plan:
    needs: check-secrets
    if: needs.check-secrets.outputs.configured == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Write OCI credentials
        run: |
          umask 077
          printf '%s' "${{ secrets.OCI_PRIVATE_KEY }}" > "$RUNNER_TEMP/oci_api_key.pem"
          echo "TF_VAR_private_key_path=$RUNNER_TEMP/oci_api_key.pem" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.oci"
          {
            printf '[DEFAULT]\n'
            printf 'tenancy=%s\n' "${{ secrets.OCI_TENANCY_OCID }}"
            printf 'user=%s\n' "${{ secrets.OCI_USER_OCID }}"
            printf 'fingerprint=%s\n' "${{ secrets.OCI_FINGERPRINT }}"
            printf 'key_file=%s\n' "$RUNNER_TEMP/oci_api_key.pem"
            printf 'region=%s\n' "${{ secrets.OCI_REGION }}"
          } > "$HOME/.oci/config"

      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="namespace=${{ secrets.TF_STATE_NAMESPACE }}" \
            -backend-config="region=${{ secrets.OCI_REGION }}" \
            -backend-config="key=oci-a1-k3s/terraform.tfstate" \
            -backend-config="auth=APIKey" \
            -backend-config="config_file_profile=DEFAULT"

      - name: Terraform Fmt Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Render plan summary
        if: always()
        run: terraform show -no-color tfplan > plan.txt

      - name: Comment plan on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.existsSync('plan.txt') ? fs.readFileSync('plan.txt', 'utf8').slice(0, 60000) : 'No plan output produced.';
            const body = `#### Terraform Plan\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  apply:
    needs: check-secrets
    if: needs.check-secrets.outputs.configured == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Write OCI credentials
        run: |
          umask 077
          printf '%s' "${{ secrets.OCI_PRIVATE_KEY }}" > "$RUNNER_TEMP/oci_api_key.pem"
          echo "TF_VAR_private_key_path=$RUNNER_TEMP/oci_api_key.pem" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.oci"
          {
            printf '[DEFAULT]\n'
            printf 'tenancy=%s\n' "${{ secrets.OCI_TENANCY_OCID }}"
            printf 'user=%s\n' "${{ secrets.OCI_USER_OCID }}"
            printf 'fingerprint=%s\n' "${{ secrets.OCI_FINGERPRINT }}"
            printf 'key_file=%s\n' "$RUNNER_TEMP/oci_api_key.pem"
            printf 'region=%s\n' "${{ secrets.OCI_REGION }}"
          } > "$HOME/.oci/config"

      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="namespace=${{ secrets.TF_STATE_NAMESPACE }}" \
            -backend-config="region=${{ secrets.OCI_REGION }}" \
            -backend-config="key=oci-a1-k3s/terraform.tfstate" \
            -backend-config="auth=APIKey" \
            -backend-config="config_file_profile=DEFAULT"

      - name: Terraform Plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan
